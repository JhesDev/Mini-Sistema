services:
  db:
    image: mysql:8.0
    container_name: mini-sistema-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: gestion_tramites
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -psecret || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-sistema-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gestion_tramites
      DB_USER: root
      DB_PASS: secret
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: mini_sistema_jwt_secret_key_2026_super_secure
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-sistema-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
